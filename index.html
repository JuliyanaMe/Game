<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Loves Chocolate</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(#dff9ff, #ffe8f4);
        font-family: Arial, sans-serif;
        color: #3a2c2f;
      }

      .game-shell {
        background: rgba(255, 255, 255, 0.45);
        border: 4px solid #ffffff;
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(111, 66, 98, 0.18);
        padding: 20px 20px 16px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .score {
        font-weight: bold;
        color: #6d4a69;
        margin-bottom: 10px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(8, 52px);
        grid-template-rows: repeat(8, 52px);
        gap: 6px;
        background: #ffffff;
        padding: 10px;
        border-radius: 18px;
        border: 3px solid #e7d9ff;
      }

      .cell {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 2rem;
        background: linear-gradient(#f1fff5, #dff8ea);
      }

      .wall {
        background: linear-gradient(#b8a18a, #8c7d6e);
      }

      .goal {
        background: linear-gradient(#ffe9a8, #ffd166);
      }

      .message {
        min-height: 28px;
        margin-top: 12px;
        font-weight: bold;
        color: #7a3d30;
      }

      .help {
        margin-top: 8px;
        font-size: 0.95rem;
        color: #5f4765;
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <h1>🐉 Dragon Loves Chocolate 🍫</h1>
      <div class="score" id="score">Chocolate collected: 0</div>
      <div class="board" id="board"></div>
      <div class="message" id="message">Use arrow keys or WASD to move.</div>
      <div class="help">Reach the chocolate without hitting the rocks.</div>
    </div>

    <script>
      const size = 8;
      const boardEl = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const messageEl = document.getElementById("message");

      let dragon = { x: 0, y: 0 };
      let chocolate = { x: 6, y: 6 };
      let score = 0;

      const walls = [
        { x: 2, y: 1 }, { x: 3, y: 1 }, { x: 5, y: 1 },
        { x: 2, y: 3 }, { x: 5, y: 3 }, { x: 6, y: 3 },
        { x: 1, y: 5 }, { x: 3, y: 5 }, { x: 5, y: 5 },
        { x: 6, y: 5 }
      ];

      function isWall(x, y) {
        return walls.some((wall) => wall.x === x && wall.y === y);
      }

      function placeChocolate() {
        chocolate.x = Math.floor(Math.random() * size);
        chocolate.y = Math.floor(Math.random() * size);

        if (dragon.x === chocolate.x && dragon.y === chocolate.y) {
          chocolate.x = (chocolate.x + 2) % size;
          chocolate.y = (chocolate.y + 1) % size;
        }

        if (isWall(chocolate.x, chocolate.y)) {
          chocolate.x = 7;
          chocolate.y = 7;
        }
      }

      function renderBoard() {
        boardEl.innerHTML = "";

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const cell = document.createElement("div");
            cell.classList.add("cell");

            if (isWall(x, y)) {
              cell.classList.add("wall");
              cell.textContent = "🪨";
            } else if (dragon.x === x && dragon.y === y) {
              cell.textContent = "🐉";
            } else if (chocolate.x === x && chocolate.y === y) {
              cell.classList.add("goal");
              cell.textContent = "🍫";
            }

            boardEl.appendChild(cell);
          }
        }
      }

      function moveDragon(dx, dy) {
        const nextX = dragon.x + dx;
        const nextY = dragon.y + dy;

        if (
          nextX < 0 ||
          nextX >= size ||
          nextY < 0 ||
          nextY >= size ||
          isWall(nextX, nextY)
        ) {
          messageEl.textContent = "The dragon bumped into a rock! Try another way.";
          return;
        }

        dragon.x = nextX;
        dragon.y = nextY;

        if (dragon.x === chocolate.x && dragon.y === chocolate.y) {
          score += 1;
          scoreEl.textContent = `Chocolate collected: ${score}`;
          messageEl.textContent = "Yay! The dragon got the chocolate! 🍫✨";
          placeChocolate();
        } else {
          messageEl.textContent = "The dragon is on the move...";
        }

        renderBoard();
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (key === "arrowup" || key === "w") moveDragon(0, -1);
        else if (key === "arrowdown" || key === "s") moveDragon(0, 1);
        else if (key === "arrowleft" || key === "a") moveDragon(-1, 0);
        else if (key === "arrowright" || key === "d") moveDragon(1, 0);
      });

      renderBoard();
    </script>
  </body>
</html>
