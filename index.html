<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Dragon's Chocolate Quest</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(#fff0f8, #dff9ff, #fff8d6);
        font-family: Arial, sans-serif;
        color: #4b2e39;
      }

      .game-shell {
        background: rgba(255, 255, 255, 0.52);
        border: 4px solid #fff;
        border-radius: 28px;
        box-shadow: 0 16px 38px rgba(138, 99, 126, 0.22);
        padding: 18px 18px 16px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .score {
        font-weight: bold;
        color: #77556d;
        margin-bottom: 12px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(8, 52px);
        grid-template-rows: repeat(8, 52px);
        gap: 6px;
        background: #fffaf5;
        padding: 10px;
        border-radius: 18px;
        border: 3px solid #f7d7ee;
      }

      .cell {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 2rem;
        background: linear-gradient(#f7fff8, #e4f7ff);
      }

      .wall {
        background: linear-gradient(#d8d0ff, #b7b0ea);
      }

      .goal {
        background: linear-gradient(#ffeeb5, #ffd36a);
      }

      .message {
        min-height: 30px;
        margin-top: 12px;
        font-weight: bold;
        color: #7b4651;
      }

      .help {
        margin-top: 8px;
        font-size: 0.95rem;
        color: #61505f;
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <h1>🐲 Tiny Dragon & Chocolate Quest 🍫</h1>
      <div class="score" id="score">Chocolate bites: 0</div>
      <div class="board" id="board"></div>
      <div class="message" id="message">Aww, the little dragon is looking for chocolate! 💖</div>
      <div class="help">Use arrow keys or W A S D to guide the baby dragon.</div>
    </div>

    <script>
      const size = 8;
      const boardEl = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const messageEl = document.getElementById("message");

      let dragon = { x: 0, y: 0 };
      let chocolate = { x: 6, y: 6 };
      let score = 0;

      const walls = [
        { x: 2, y: 1 }, { x: 3, y: 1 }, { x: 5, y: 1 },
        { x: 2, y: 3 }, { x: 5, y: 3 }, { x: 6, y: 3 },
        { x: 1, y: 5 }, { x: 3, y: 5 }, { x: 5, y: 5 },
        { x: 6, y: 5 }
      ];

      function isWall(x, y) {
        return walls.some((wall) => wall.x === x && wall.y === y);
      }

      function placeChocolate() {
        chocolate.x = Math.floor(Math.random() * size);
        chocolate.y = Math.floor(Math.random() * size);

        if (dragon.x === chocolate.x && dragon.y === chocolate.y) {
          chocolate.x = (chocolate.x + 2) % size;
          chocolate.y = (chocolate.y + 1) % size;
        }

        if (isWall(chocolate.x, chocolate.y)) {
          chocolate.x = 7;
          chocolate.y = 7;
        }
      }

      function renderBoard() {
        boardEl.innerHTML = "";

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const cell = document.createElement("div");
            cell.classList.add("cell");

            if (isWall(x, y)) {
              cell.classList.add("wall");
              cell.textContent = "🌼";
            } else if (dragon.x === x && dragon.y === y) {
              cell.textContent = "🐲";
            } else if (chocolate.x === x && chocolate.y === y) {
              cell.classList.add("goal");
              cell.textContent = "🍫";
            }

            boardEl.appendChild(cell);
          }
        }
      }

      function moveDragon(dx, dy) {
        const nextX = dragon.x + dx;
        const nextY = dragon.y + dy;

        if (
          nextX < 0 ||
          nextX >= size ||
          nextY < 0 ||
          nextY >= size ||
          isWall(nextX, nextY)
        ) {
          messageEl.textContent = "Oh no! The tiny dragon bumped into the flower patch. Try again! 🥺";
          return;
        }

        dragon.x = nextX;
        dragon.y = nextY;

        if (dragon.x === chocolate.x && dragon.y === chocolate.y) {
          score += 1;
          scoreEl.textContent = `Chocolate bites: ${score}`;
          messageEl.textContent = "Yay! The cute dragon got the chocolate! 💖✨";
          placeChocolate();
        } else {
          messageEl.textContent = "The tiny dragon is waddling closer... 🐾";
        }

        renderBoard();
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (key === "arrowup" || key === "w") moveDragon(0, -1);
        else if (key === "arrowdown" || key === "s") moveDragon(0, 1);
        else if (key === "arrowleft" || key === "a") moveDragon(-1, 0);
        else if (key === "arrowright" || key === "d") moveDragon(1, 0);
      });

      renderBoard();
    </script>
  </body>
</html>
